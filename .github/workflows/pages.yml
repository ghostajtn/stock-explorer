name: Build data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # every 30 min during US market hours, Mon-Fri (UTC)
    - cron: '0 6 * * *'            # plus once a day
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch market data into public/data
        run: node build-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
