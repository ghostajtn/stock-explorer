<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Explorer</title>
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stocks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c2330;--line:#2a3342;--text:#e6edf3;--mute:#8b98a9;--up:#3fb950;--down:#f85149;--accent:#58a6ff;--warn:#d29922;--c1:#58a6ff;--c2:#3fb950;--c3:#d29922}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f8fa;--panel:#fff;--panel2:#f0f3f6;--line:#d8dee4;--text:#1f2328;--mute:#59636e;--up:#1a7f37;--down:#cf222e;--accent:#0969da;--warn:#9a6700;--c1:#0969da;--c2:#1a7f37;--c3:#9a6700}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;cursor:pointer;white-space:nowrap}
#searchwrap{position:relative;flex:1;max-width:420px}
#search{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#sugg{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-top:4px;overflow:hidden;display:none}
#sugg div{padding:8px 12px;cursor:pointer}#sugg div:hover{background:var(--line)}
main{max-width:1500px;margin:0 auto;padding:20px}
.muted{color:var(--mute)}.up{color:var(--up)}.down{color:var(--down)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th.sorted{color:var(--accent)}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:var(--panel2)}
tbody tr.watch{background:var(--panel2);box-shadow:inset 3px 0 0 var(--warn)}
.sym{font-weight:700}.nm{color:var(--mute);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;display:block}
.bar{width:70px;height:6px;background:var(--line);border-radius:3px;display:inline-block;position:relative;vertical-align:middle}
.bar i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--accent)}
.pe-lo{color:var(--up)}.pe-hi{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.kpi{background:var(--panel2);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:17px;margin-top:2px}.kpi span{font-size:12px;color:var(--mute)}
.hdr{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:14px}
.hdr h2{margin:0;font-size:26px}.price{font-size:30px;font-weight:700}
.tabs{display:flex;gap:4px;margin:6px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;margin-right:8px;font-weight:600;text-transform:uppercase}
.tag.deal{background:#1a7f3733;color:var(--up)}.tag.analyst{background:#0969da33;color:var(--accent)}.tag.earnings{background:#9a670033;color:var(--warn)}.tag.news{background:var(--line);color:var(--mute)}
.news li{padding:9px 0;border-bottom:1px solid var(--line);list-style:none}.news{margin:0;padding:0}
.pill{display:flex;height:22px;border-radius:5px;overflow:hidden;font-size:11px;color:#fff}.pill div{display:flex;align-items:center;justify-content:center}
svg text{fill:var(--mute);font-size:11px}
#tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;z-index:9}
.sent{display:inline-block;font-size:11px;width:16px;text-align:center;border-radius:4px;margin-right:6px;font-weight:700}
.sent.pos{background:#1a7f3733;color:var(--up)}.sent.neg{background:#cf222e33;color:var(--down)}.sent.neu{background:var(--line);color:var(--mute)}
.star{background:none;border:0;font-size:22px;cursor:pointer;color:var(--warn);padding:0 6px}
.alerts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.alerts input{width:90px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{background:var(--panel2);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;box-shadow:0 4px 16px #0006;max-width:320px}
.err{padding:30px;text-align:center;color:var(--down)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.loading{padding:40px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1 onclick="location.hash='#/'">📈 Stock Explorer</h1>
  <div id="searchwrap"><input id="search" placeholder="Search any company or ticker…" autocomplete="off"><div id="sugg"></div></div>
  <span class="muted" id="stamp"></span>
  <button class="chip" id="install" hidden style="margin-left:auto">⬇ Install app</button>
</header>
<main id="app"></main>
<div id="tip"></div>
<div id="toasts"></div>
<script src="vendor/lightweight-charts.js"></script>
<script>
// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isN = (v) => typeof v === 'number' && isFinite(v);
const nf = (v, d = 2) => isN(v) ? v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const usd = (v, d = 2) => isN(v) ? '$' + nf(v, d) : '—';
const big = (v) => {
  if (!isN(v)) return '—';
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e12) return s + '$' + (a / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return s + '$' + (a / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(1) + 'M';
  return s + '$' + nf(a, 0);
};
const pct = (v, d = 1) => isN(v) ? (v * 100).toFixed(d) + '%' : '—';      // ratio → %
const pc = (v, d = 2) => isN(v) ? (v >= 0 ? '+' : '') + v.toFixed(d) + '%' : '—'; // already %
const cls = (v) => !isN(v) ? '' : v >= 0 ? 'up' : 'down';
const date = (s) => s ? new Date(s * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const ago = (ms) => { const m = (Date.now() - ms) / 6e4; return m < 60 ? Math.round(m) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
// On GitHub Pages (or with ?static) there is no server: read the pre-built snapshot in ./data instead.
const STATIC = location.hostname.endsWith('github.io') || new URLSearchParams(location.search).has('static');
const staticUrl = (u) => {
  const url = new URL(u, location.href); let m;
  if (url.pathname === '/api/top50') return 'data/top50.json';
  if ((m = url.pathname.match(/^\/api\/stock\/(.+)$/))) return `data/stock/${m[1].toUpperCase()}.json`;
  if ((m = url.pathname.match(/^\/api\/chart\/(.+)$/))) return `data/chart/${m[1].toUpperCase()}-${url.searchParams.get('range') || '1y'}.json`;
  return null;
};
const api = async (u) => {
  if (STATIC) {
    const url = new URL(u, location.href);
    if (url.pathname === '/api/search') {            // search only covers the published snapshot
      const q = (url.searchParams.get('q') || '').toLowerCase(), d = await api('/api/top50');
      return [...(d.watch || []), ...d.rows].filter((r) => r.symbol.toLowerCase().includes(q) || (r.name || '').toLowerCase().includes(q))
        .slice(0, 8).map((r) => ({ symbol: r.symbol, name: r.name, exchange: 'snapshot' }));
    }
    if (url.pathname.startsWith('/api/pipeline/')) {
      const all = await (await fetch('data/pipeline.json')).json();
      return all[url.pathname.split('/').pop().toUpperCase()] || null;
    }
    const r = await fetch(staticUrl(u));
    if (!r.ok) throw new Error('Not in the published snapshot (only the top 50 + watchlist are available on this site)');
    return r.json();
  }
  const r = await fetch(u); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
};
const kpi = (label, val, sub = '') => `<div class="kpi"><span>${label}</span><b>${val}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
const app = $('#app');

// ---------- installable app (PWA) ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('#install').hidden = false; });
$('#install').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#install').hidden = true; };
addEventListener('appinstalled', () => { $('#install').hidden = true; });
addEventListener('offline', () => { $('#stamp').textContent = 'Offline: showing last saved data'; });
addEventListener('online', () => route());

// ---------- search ----------
const sBox = $('#search'), sugg = $('#sugg');
let sTimer;
sBox.addEventListener('input', () => {
  clearTimeout(sTimer);
  const q = sBox.value.trim();
  if (!q) { sugg.style.display = 'none'; return; }
  sTimer = setTimeout(async () => {
    try {
      const r = await api('/api/search?q=' + encodeURIComponent(q));
      sugg.innerHTML = r.map((x) => `<div data-s="${esc(x.symbol)}"><b>${esc(x.symbol)}</b> <span class="muted">${esc(x.name)} · ${esc(x.exchange)}</span></div>`).join('');
      sugg.style.display = r.length ? 'block' : 'none';
    } catch { sugg.style.display = 'none'; }
  }, 200);
});
sBox.addEventListener('keydown', (e) => { if (e.key === 'Enter' && sBox.value.trim()) go(sBox.value.trim().toUpperCase()); });
sugg.addEventListener('click', (e) => { const d = e.target.closest('[data-s]'); if (d) go(d.dataset.s); });
document.addEventListener('click', (e) => { if (!e.target.closest('#searchwrap')) sugg.style.display = 'none'; });
function go(sym) { sBox.value = ''; sugg.style.display = 'none'; location.hash = '#/' + sym; }

// ---------- my watchlist + price alerts (kept in this browser; alerts fire while the app is open) ----------
const wl = {
  get() { try { return JSON.parse(localStorage.getItem('se.watch')) || []; } catch { return []; } },
  set(v) { try { localStorage.setItem('se.watch', JSON.stringify(v)); } catch {} },
  find(sym) { return this.get().find((w) => w.s === sym); },
  toggle(sym) { const l = this.get(), i = l.findIndex((w) => w.s === sym); i < 0 ? l.push({ s: sym }) : l.splice(i, 1); this.set(l); },
  alert(sym, above, below) {
    const l = this.get(); let w = l.find((x) => x.s === sym); if (!w) l.push(w = { s: sym });
    w.above = above; w.below = below; this.set(l);
  },
};
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 20000); t.onclick = () => t.remove();
  try { if (window.Notification && Notification.permission === 'granted') new Notification('Stock Explorer', { body: msg }); } catch {}
}
async function checkAlerts() {
  if (STATIC) return;                                   // the published snapshot has no live prices
  const active = wl.get().filter((w) => w.above != null || w.below != null);
  if (!active.length) return;
  let qs; try { qs = await api('/api/quotes?symbols=' + active.map((w) => w.s).join(',')); } catch { return; }
  const list = wl.get(); let changed = false;
  for (const q of qs) {
    const w = list.find((x) => x.s === q.symbol); if (!w || !isN(q.price)) continue;
    if (w.above != null && q.price >= w.above) { toast(`${q.symbol} is ${usd(q.price)}, above your ${usd(w.above)} alert`); w.above = null; changed = true; }
    if (w.below != null && q.price <= w.below) { toast(`${q.symbol} is ${usd(q.price)}, below your ${usd(w.below)} alert`); w.below = null; changed = true; }
  }
  if (changed) { wl.set(list); if (location.hash.length <= 2) renderMyWl(); else renderWlBar(); }
}
setInterval(checkAlerts, 60000); setTimeout(checkAlerts, 4000);

// star + alert controls on a stock's page
let wlSym = null;
function renderWlBar() {
  const bar = $('#wlbar'); if (!bar || !wlSym) return;
  const w = wl.find(wlSym), on = !!w;
  bar.innerHTML = `<button class="star" id="wlstar" title="${on ? 'Remove from my watchlist' : 'Add to my watchlist'}">${on ? '★' : '☆'}</button>
    <span class="muted">Alert me when price is</span> above <input id="alup" type="number" step="any" placeholder="$" value="${w?.above ?? ''}"> below <input id="aldn" type="number" step="any" placeholder="$" value="${w?.below ?? ''}">
    <button class="chip" id="alset">Set alert</button>${STATIC ? '<span class="muted">(alerts need the local app)</span>' : ''}`;
  $('#wlstar').onclick = () => { wl.toggle(wlSym); renderWlBar(); };
  $('#alset').onclick = () => {
    const num = (id) => { const x = parseFloat($(id).value); return isFinite(x) && x > 0 ? x : null; };
    wl.alert(wlSym, num('#alup'), num('#aldn'));
    try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch {}
    toast('Alert saved. It checks every minute while this app is open.'); renderWlBar(); checkAlerts();
  };
}

// "My watchlist" card on the home page
async function renderMyWl() {
  const box = $('#mywl'); if (!box) return;
  const list = wl.get();
  if (!list.length) { box.innerHTML = '<div class="muted">Open any stock and press ☆ to add it to your watchlist.</div>'; return; }
  let px = {};
  try { (STATIC ? [...home.rows, ...(home.watch || [])] : await api('/api/quotes?symbols=' + list.map((w) => w.s).join(','))).forEach((q) => px[q.symbol] = q); } catch {}
  box.innerHTML = `<table><thead><tr><th class="l">Stock</th><th>Price</th><th>Change</th><th>Alerts</th><th></th></tr></thead><tbody>${list.map((w) => {
    const q = px[w.s] || {};
    const al = [w.above != null ? `▲ ${usd(w.above)}` : '', w.below != null ? `▼ ${usd(w.below)}` : ''].filter(Boolean).join('  ') || '—';
    return `<tr class="row" data-s="${esc(w.s)}"><td class="l"><span class="sym">${esc(w.s)}</span><span class="nm">${esc(q.name || '')}</span></td><td>${usd(q.price)}</td><td class="${cls(q.changePct)}">${pc(q.changePct)}</td><td>${al}</td><td><button class="star" data-rm="${esc(w.s)}" title="Remove">★</button></td></tr>`;
  }).join('')}</tbody></table>`;
  box.querySelectorAll('tr.row').forEach((tr) => tr.onclick = () => location.hash = '#/' + tr.dataset.s);
  box.querySelectorAll('[data-rm]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); wl.toggle(b.dataset.rm); renderMyWl(); });
}

// ---------- router ----------
let timer;
async function route() {
  clearInterval(timer);
  const sym = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  window.scrollTo(0, 0);
  sym ? await detailView(sym) : await homeView();
}
addEventListener('hashchange', route);
route();

// ---------- home: top 50 ----------
const home = { rows: [], sort: { key: 'marketCap', dir: -1 }, filter: '', chips: new Set() };
const COLS = [
  ['rank', '#'], ['symbol', 'Company', 'l'], ['price', 'Price'], ['changePct', '1D'], ['marketCap', 'Mkt cap'],
  ['pe', 'P/E (TTM)'], ['forwardPE', 'Fwd P/E'], ['eps', 'EPS TTM'], ['epsForward', 'EPS fwd'], ['epsGrowth', 'Fwd EPS Δ'],
  ['pb', 'P/B'], ['divYield', 'Div yld'], ['range', '52-wk range'], ['earningsTs', 'Next earnings'], ['rating', 'Analysts'],
];
const CHIPS = {
  cheap: ['Fwd P/E < 25', (r) => isN(r.forwardPE) && r.forwardPE < 25],
  soon: ['Earnings ≤ 14 days', (r) => r.earningsTs && r.earningsTs * 1000 > Date.now() && r.earningsTs * 1000 - Date.now() < 14 * 864e5],
  low: ['Near 52-wk low', (r) => isN(r.range) && r.range < 0.25],
  growth: ['Fwd EPS +30%', (r) => isN(r.epsGrowth) && r.epsGrowth > 0.3],
  div: ['Pays dividend', (r) => isN(r.divYield) && r.divYield > 0],
};

async function homeView() {
  app.innerHTML = '<div class="loading">Loading top 50 by market cap…</div>';
  try { await loadHome(); } catch (e) { app.innerHTML = `<div class="err">Could not load data: ${esc(e.message)}</div>`; return; }
  renderHome();
  timer = setInterval(async () => { try { await loadHome(); renderTable(); renderMyWl(); } catch {} }, 60000);
}
async function loadHome() {
  const d = await api('/api/top50');
  const derive = (r) => ({
    ...r,
    epsGrowth: isN(r.eps) && r.eps > 0 && isN(r.epsForward) ? r.epsForward / r.eps - 1 : null,
    range: isN(r.high52) && r.high52 > r.low52 ? (r.price - r.low52) / (r.high52 - r.low52) : null,
  });
  home.rows = d.rows.map(derive);
  home.watch = (d.watch || []).map(derive);
  $('#stamp').textContent = 'Updated ' + new Date(d.updated).toLocaleTimeString();
}
function renderHome() {
  app.innerHTML = `
    <div class="toolbar">
      <input id="flt" class="chip" style="min-width:220px;cursor:text" placeholder="Filter by name/ticker" value="${esc(home.filter)}">
      ${Object.entries(CHIPS).map(([k, [l]]) => `<button class="chip ${home.chips.has(k) ? 'on' : ''}" data-chip="${k}">${l}</button>`).join('')}
      <span class="muted" id="count"></span>
    </div>
    <div class="card scroll"><h3>★ My watchlist</h3><div id="mywl"></div></div>
    <div class="card scroll" style="padding:0"><table id="tbl"></table></div>
    <p class="note">Top 50 ranked live by market cap from a ~100-company candidate list. Data: Yahoo Finance (delayed/unofficial). Not investment advice. Click a row for full detail.</p>`;
  $('#flt').oninput = (e) => { home.filter = e.target.value; renderTable(); };
  app.querySelectorAll('[data-chip]').forEach((b) => b.onclick = () => {
    const k = b.dataset.chip; home.chips.has(k) ? home.chips.delete(k) : home.chips.add(k);
    b.classList.toggle('on'); renderTable();
  });
  renderTable(); renderMyWl();
}
function renderTable() {
  const { key, dir } = home.sort, f = home.filter.toLowerCase();
  let rows = home.rows.filter((r) => (!f || r.symbol.toLowerCase().includes(f) || (r.name || '').toLowerCase().includes(f)) &&
    [...home.chips].every((c) => CHIPS[c][1](r)));
  rows = rows.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * dir;
  });
  const peCls = (v) => !isN(v) ? '' : v < 15 ? 'pe-lo' : v > 40 ? 'pe-hi' : '';
  const earn = (ts) => {
    if (!ts) return '—';
    const d = ts * 1000 - Date.now(), days = Math.ceil(d / 864e5);
    return d > 0 ? `${date(ts)} <span class="muted">(${days}d)</span>` : `<span class="muted">${date(ts)}</span>`;
  };
  // Watchlist rows are pinned on top and ignore the filters/sort.
  rows = [...(home.watch || []), ...rows];
  $('#tbl').innerHTML = `<thead><tr>${COLS.map(([k, l, c]) => `<th class="${c || ''} ${k === key ? 'sorted' : ''}" data-k="${k}">${l}${k === key ? (dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r) => `<tr class="row ${r.watch ? 'watch' : ''}" data-s="${esc(r.symbol)}">
    <td class="${r.watch ? '' : 'muted'}" ${r.watch ? 'style="color:var(--warn)" title="Watchlist"' : ''}>${r.rank}</td>
    <td class="l"><span class="sym">${esc(r.symbol)}</span><span class="nm">${esc(r.name)}</span></td>
    <td>${nf(r.price)}</td><td class="${cls(r.changePct)}">${pc(r.changePct)}</td><td>${big(r.marketCap)}</td>
    <td class="${peCls(r.pe)}">${r.pe > 0 ? nf(r.pe, 1) : 'n/m'}</td><td class="${peCls(r.forwardPE)}" ${r.forwardPE <= 0 ? 'title="Negative expected earnings"' : ''}>${r.forwardPE > 0 ? nf(r.forwardPE, 1) : 'n/m'}</td>
    <td>${nf(r.eps)}</td><td>${nf(r.epsForward)}</td><td class="${cls(r.epsGrowth)}">${isN(r.epsGrowth) ? pc(r.epsGrowth * 100, 0) : '—'}</td>

function lineChart(el, pts, prev) {
  const W = 900, H = 280, P = { l: 56, r: 12, t: 10, b: 24 };
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = xs[0], x1 = xs[xs.length - 1];
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const X = (x) => P.l + (x - x0) / (x1 - x0 || 1) * (W - P.l - P.r), Y = (y) => P.t + (1 - (y - lo) / (hi - lo)) * (H - P.t - P.b);
  const up = ys[ys.length - 1] >= ys[0], col = up ? 'var(--up)' : 'var(--down)';
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const grid = [0, 1, 2, 3].map((i) => { const v = lo + (hi - lo) * i / 3; return `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end">${nf(v, 0)}</text>`; }).join('');
  const xl = [0, 1, 2, 3].map((i) => { const t = x0 + (x1 - x0) * i / 3; return `<text x="${X(t)}" y="${H - 6}" text-anchor="middle">${new Date(t).toLocaleDateString('en-US', { month: 'short', year: '2-digit', day: (x1 - x0) < 40 * 864e5 ? 'numeric' : undefined })}</text>`; }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${xl}
    <path d="${d}L${X(x1)} ${H - P.b}L${X(x0)} ${H - P.b}Z" fill="${col}" opacity=".08"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="2"/><line id="cur" y1="${P.t}" y2="${H - P.b}" stroke="var(--mute)" opacity="0"/></svg>`;
  const svg = el.firstChild, tip = $('#tip'), cur = $('#cur', el);
  svg.onmousemove = (e) => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * W;
    const t = x0 + (vx - P.l) / (W - P.l - P.r) * (x1 - x0);
    let lo2 = 0, hi2 = xs.length - 1; while (lo2 < hi2) { const m = (lo2 + hi2) >> 1; xs[m] < t ? lo2 = m + 1 : hi2 = m; }
    const p = pts[lo2]; cur.setAttribute('x1', X(p[0])); cur.setAttribute('x2', X(p[0])); cur.setAttribute('opacity', '.6');
    tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY - 30 + 'px';
    tip.textContent = `${new Date(p[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}  ${usd(p[1])}`;
  };
  svg.onmouseleave = () => { tip.style.display = 'none'; cur.setAttribute('opacity', '0'); };
}

  const xl = labels.map((l, i) => `<text x="${P.l + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle">${l}</text>`).join('');

    const ar = a.TotalRevenue || [];
    if (ar.length) {
      const ag = (k, i) => a[k]?.find((x) => x.date === ar[i].date)?.v ?? null, m = Math.min(6, ar.length), ai = ar.slice(-m).map((_, i) => ar.length - m + i);
      el.insertAdjacentHTML('beforeend', `<div class="card scroll"><h3>Annual</h3><table><thead><tr><th class="l"></th>${ai.map((i) => `<th>${ar[i].date.slice(0, 4)}</th>`).join('')}</tr></thead><tbody>
        ${[['Revenue', (i) => big(ar[i].v)], ['  YoY', (i) => { const y = i > 0 && ar[i - 1].v ? ar[i].v / ar[i - 1].v - 1 : null; return `<span class="${cls(y)}">${pct(y)}</span>`; }],
          ['Net income', (i) => big(ag('NetIncome', i))], ['Diluted EPS', (i) => usd(ag('DilutedEPS', i))], ['Free cash flow', (i) => big(ag('FreeCashFlow', i))]]
          .map(([l, f]) => `<tr><td class="l">${l.replace(/^ +/, '&nbsp;&nbsp;')}</td>${ai.map((i) => `<td>${f(i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    }
  },

  Earnings(el, s) {
    const ce = s.calendarEvents || {}, ed = ce.earnings || {}, hist = s.earningsHistory?.history || [], trend = s.earningsTrend?.trend || [];
    const nextTs = (ed.earningsDate || [])[0];
    const names = { '0q': 'Current quarter', '+1q': 'Next quarter', '0y': 'Current year', '+1y': 'Next year' };
    el.innerHTML = `<div class="card"><h3>Next earnings</h3><div class="grid">
      ${kpi('Date', nextTs ? date(nextTs) : '—', nextTs && nextTs * 1000 > Date.now() ? `in ${Math.ceil((nextTs * 1000 - Date.now()) / 864e5)} days` : '')}
      ${kpi('EPS estimate (avg)', usd(ed.earningsAverage), `${usd(ed.earningsLow)} – ${usd(ed.earningsHigh)}`)}${kpi('Revenue estimate', big(ed.revenueAverage), `${big(ed.revenueLow)} – ${big(ed.revenueHigh)}`)}</div></div>
    <div class="card scroll"><h3>Estimates &amp; growth</h3><table><thead><tr><th class="l">Period</th><th>EPS avg</th><th>Low–High</th><th>Year-ago EPS</th><th>EPS growth</th><th>Revenue avg</th><th>Rev growth</th><th>Analysts</th></tr></thead><tbody>
      ${trend.filter((t) => names[t.period]).map((t) => `<tr><td class="l">${names[t.period]} <span class="muted">${esc(t.endDate || '')}</span></td><td>${usd(t.earningsEstimate?.avg)}</td><td>${nf(t.earningsEstimate?.low)}–${nf(t.earningsEstimate?.high)}</td><td>${usd(t.earningsEstimate?.yearAgoEps)}</td>
      <td class="${cls(t.earningsEstimate?.growth)}">${pct(t.earningsEstimate?.growth)}</td><td>${big(t.revenueEstimate?.avg)}</td><td class="${cls(t.revenueEstimate?.growth)}">${pct(t.revenueEstimate?.growth)}</td><td>${t.earningsEstimate?.numberOfAnalysts ?? '—'}</td></tr>`).join('')}</tbody></table></div>
    <div class="card scroll"><h3>Surprise history (last 4 quarters)</h3><table><thead><tr><th class="l">Quarter</th><th>Estimate</th><th>Actual</th><th>Difference</th><th>Surprise</th></tr></thead><tbody>
      ${hist.map((h) => `<tr><td class="l">${date(h.quarter)}</td><td>${usd(h.epsEstimate)}</td><td>${usd(h.epsActual)}</td><td class="${cls(h.epsDifference)}">${usd(h.epsDifference)}</td><td class="${cls(h.surprisePercent)}">${pct(h.surprisePercent)}</td></tr>`).join('') || '<tr><td class="l muted">No history</td></tr>'}</tbody></table></div>`;
  },

  'Deals & News'(el, s, pipe) {
    const ce = s.calendarEvents || {}, nextE = (ce.earnings?.earningsDate || [])[0];
    const upcoming = [
      nextE && ['Earnings', date(nextE)], ce.exDividendDate && ['Ex-dividend', date(ce.exDividendDate)], ce.dividendDate && ['Dividend pay date', date(ce.dividendDate)],
    ].filter(Boolean);
    const deals = s.news.filter((n) => n.tag === 'deal');
    const SENT = { pos: ['▲', 'Positive wording'], neg: ['▼', 'Negative wording'], neu: ['•', 'Neutral wording'] };
    const newsRow = (n) => `<li><span class="sent ${n.sentiment || 'neu'}" title="${SENT[n.sentiment || 'neu'][1]}">${SENT[n.sentiment || 'neu'][0]}</span><span class="tag ${n.tag}">${n.tag}</span><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a> <span class="muted">· ${esc(n.source || '')} · ${n.ts ? ago(n.ts) : ''}</span></li>`;
    el.innerHTML = `${pipe ? `
      <div class="card"><h3>Forward deals &amp; pipeline <span style="text-transform:none;font-weight:400">· ${esc(pipe.asOf)}</span></h3>
        <div class="scroll"><table><thead><tr><th class="l">Partner</th><th class="l">What</th><th class="l">Size</th><th class="l">Timing</th></tr></thead><tbody>
        ${pipe.deals.map((d) => `<tr><td class="l"><b>${esc(d.partner)}</b></td><td class="l" style="white-space:normal;min-width:320px">${esc(d.what)}</td><td class="l" style="white-space:normal">${esc(d.size)}</td><td class="l" style="white-space:normal">${esc(d.timing)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="two"><div class="card"><h3>Management guidance</h3>${pipe.guidance.map((g) => `<div style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${esc(g.label)}</span><br><b>${esc(g.value)}</b></div>`).join('')}</div>
      <div class="card"><h3>Risks flagged</h3><ul>${pipe.risks.map((r) => `<li style="margin-bottom:6px">${esc(r)}</li>`).join('')}</ul></div></div>`
      : `<div class="card muted">No hand-curated deal pipeline for ${esc(s.symbol)} yet. Add an entry to <code>pipeline.json</code> (see the AVGO example) to show forward deals and guidance here.</div>`}
    <div class="two"><div class="card"><h3>Upcoming events</h3>${upcoming.map(([l, d]) => `<div style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${l}</span> <b style="float:right">${d}</b></div>`).join('') || '<span class="muted">None scheduled</span>'}</div>
    <div class="card"><h3>Deal headlines</h3>${deals.length ? `<ul class="news">${deals.map(newsRow).join('')}</ul>` : '<span class="muted">No headlines tagged as deals. What counts as a deal is decided in <code>classify.js</code>.</span>'}</div></div>
    <div class="card"><h3>Latest news <span class="muted" style="text-transform:none;letter-spacing:0">· headline wording: ${s.news.filter((n) => n.sentiment === 'pos').length} ▲ / ${s.news.filter((n) => n.sentiment === 'neg').length} ▼ of ${s.news.length}</span></h3><div class="toolbar" id="nf">${['all', 'deal', 'earnings', 'analyst', 'news'].map((t) => `<button class="chip ${t === 'all' ? 'on' : ''}" data-f="${t}">${t}</button>`).join('')}</div><ul class="news" id="nl"></ul></div>`;
    const draw = (f) => { $('#nl', el).innerHTML = s.news.filter((n) => f === 'all' || n.tag === f).map(newsRow).join('') || '<li class="muted">Nothing here</li>'; };
    $('#nf', el).querySelectorAll('button').forEach((b) => b.onclick = () => { $('#nf', el).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); draw(b.dataset.f); });
    draw('all');
  },

  Analysts(el, s) {
    const fd = s.financialData || {}, rt = s.recommendationTrend?.trend || [], ud = s.upgradeDowngradeHistory?.history || [], px = s.price?.regularMarketPrice;
    const cur = rt[0], tot = cur ? cur.strongBuy + cur.buy + cur.hold + cur.sell + cur.strongSell : 0;
    const seg = (n, c, l) => n ? `<div style="flex:${n};background:${c}" title="${l}: ${n}">${n}</div>` : '';
    const lo = fd.targetLowPrice, hi = fd.targetHighPrice, mean = fd.targetMeanPrice;
    const span = Math.max(hi ?? 0, px ?? 0) * 1.05, pos = (v) => isN(v) && span ? (v / span * 100) + '%' : '0';
    el.innerHTML = `<div class="two"><div class="card"><h3>Consensus</h3><div class="grid" style="margin-bottom:14px">
      ${kpi('Rating', esc((fd.recommendationKey || '—').replace('_', ' ')), `${fd.numberOfAnalystOpinions ?? '—'} analysts · mean ${nf(fd.recommendationMean, 1)} (1=Strong buy)`)}
      ${kpi('Mean target', usd(mean), isN(mean) && isN(px) ? pc((mean / px - 1) * 100, 1) + ' vs price' : '')}</div>
      ${cur ? `<div class="pill">${seg(cur.strongBuy, '#1a7f37', 'Strong buy')}${seg(cur.buy, '#3fb950', 'Buy')}${seg(cur.hold, '#9a6700', 'Hold')}${seg(cur.sell, '#cf222e', 'Sell')}${seg(cur.strongSell, '#8b1a1a', 'Strong sell')}</div><div class="note">Strong buy · Buy · Hold · Sell · Strong sell (${tot} ratings this month)</div>` : ''}</div>
      <div class="card"><h3>Price target range</h3><div style="position:relative;height:60px;margin-top:20px">
        <div style="position:absolute;top:26px;left:0;right:0;height:6px;background:var(--line);border-radius:3px"></div>
        ${isN(lo) && isN(hi) ? `<div style="position:absolute;top:26px;height:6px;background:var(--accent);opacity:.5;left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>` : ''}
        ${[[lo, 'Low'], [mean, 'Mean'], [hi, 'High'], [px, 'Price']].filter(([v]) => isN(v)).map(([v, l], i) => `<div style="position:absolute;left:${pos(v)};top:${l === 'Price' ? 36 : 0}px;transform:translateX(-50%);text-align:center;font-size:12px;white-space:nowrap"><b>${nf(v, 0)}</b><br><span class="muted">${l}</span></div>`).join('')}</div></div></div>
      <div class="card scroll"><h3>Recent rating changes</h3><table><thead><tr><th class="l">Date</th><th class="l">Firm</th><th class="l">Action</th><th class="l">From → To</th></tr></thead><tbody>
      ${ud.slice(0, 15).map((u) => `<tr><td class="l">${date(u.epochGradeDate)}</td><td class="l">${esc(u.firm)}</td><td class="l">${esc(u.action)}</td><td class="l">${esc(u.fromGrade || '—')} → <b>${esc(u.toGrade)}</b></td></tr>`).join('') || '<tr><td class="l muted">None</td></tr>'}</tbody></table></div>`;
  },

  Ownership(el, s) {
    const mh = s.majorHoldersBreakdown || {}, ins = s.insiderTransactions?.transactions || [], np = s.netSharePurchaseActivity || {};
    el.innerHTML = `<div class="card"><h3>Who owns it</h3><div class="grid">
      ${kpi('Insiders', pct(mh.insidersPercentHeld, 2))}${kpi('Institutions (% of float)', pct(mh.institutionsFloatPercentHeld))}${kpi('Institutions held', pct(mh.institutionsPercentHeld))}${kpi('# institutions', isN(mh.institutionsCount) ? mh.institutionsCount.toLocaleString() : '—')}
      ${kpi('Insider net shares (6m)', isN(np.netInfoShares) ? nf(np.netInfoShares, 0) : '—', `${np.buyInfoCount ?? 0} buys / ${np.sellInfoCount ?? 0} sells`)}</div></div>
      <div class="card scroll"><h3>Recent insider transactions</h3><table><thead><tr><th class="l">Date</th><th class="l">Insider</th><th class="l">Role</th><th class="l">Transaction</th><th>Shares</th><th>Value</th></tr></thead><tbody>
      ${ins.slice(0, 20).map((t) => `<tr><td class="l">${date(t.startDate)}</td><td class="l">${esc(t.filerName)}</td><td class="l">${esc(t.filerRelation)}</td><td class="l" style="white-space:normal;max-width:300px">${esc(t.transactionText || '—')}</td><td>${isN(t.shares) ? nf(t.shares, 0) : '—'}</td><td>${big(t.value)}</td></tr>`).join('') || '<tr><td class="l muted">None</td></tr>'}</tbody></table></div>`;
  },

  About(el, s) {
    const a = s.assetProfile || {};
    el.innerHTML = `<div class="card"><h3>Business</h3><p style="max-width:900px">${esc(a.longBusinessSummary || 'No description.')}</p><div class="grid">
      ${kpi('Employees', isN(a.fullTimeEmployees) ? a.fullTimeEmployees.toLocaleString() : '—')}${kpi('HQ', esc([a.city, a.state, a.country].filter(Boolean).join(', ')) || '—')}
      ${kpi('Website', a.website ? `<a href="${esc(a.website)}" target="_blank" rel="noopener">${esc(a.website.replace(/^https?:\/\//, ''))}</a>` : '—')}</div></div>
      <div class="card scroll"><h3>Leadership</h3><table><thead><tr><th class="l">Name</th><th class="l">Title</th><th>Pay</th></tr></thead><tbody>
      ${(a.companyOfficers || []).slice(0, 10).map((o) => `<tr><td class="l">${esc(o.name)}</td><td class="l">${esc(o.title)}</td><td>${big(o.totalPay)}</td></tr>`).join('')}</tbody></table></div>`;
  },
};
</script>
</body>
</html>
